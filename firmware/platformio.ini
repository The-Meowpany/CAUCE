[platformio]
default_envs = native

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32dev]
; Pinned: the firmware targets arduino-esp32 2.0.17, which espressif32 6.9.0 ships. An unpinned
; platform resolves to the 3.x core, whose watchdog and Wi-Fi APIs differ and do not compile.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; The core adds -std=gnu++11 after our flags, which built every library as C++11 while the
; firmware is written to C++17. Removing it leaves -std=gnu++17 as the only standard.
build_unflags = -std=gnu++11
board_build.partitions = partitions.csv
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D CAUCE_NODE_ID_DEFAULT=\"CAUCE-001\"
build_src_filter = +<main.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.4

[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -D CAUCE_HOST_SIMULATION=1
build_src_filter = +<main.cpp>
test_build_src = false

[env:integration]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -D CAUCE_HOST_SIMULATION=1
build_src_filter = -<main.cpp> +<integration_main.cpp>
extra_scripts = pre:scripts/native_winsock.py

; Bench self-test. A separate environment so the product firmware never contains a
; self-test entry point reachable in the field. See src/bench_main.cpp for what this
; covers that the host suite cannot.
[env:bench]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; The core adds -std=gnu++11 after our flags, which built every library as C++11 while the
; firmware is written to C++17. Removing it leaves -std=gnu++17 as the only standard.
build_unflags = -std=gnu++11
board_build.partitions = partitions.csv
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D CAUCE_NODE_ID_DEFAULT=\"CAUCE-BENCH\"
build_src_filter = +<bench_main.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.4

; LoRa gateway bridge: ESP32 + SX1276 on USB serial, relaying for cauce_server.gateway_runner.
; Its own environment so none of it is reachable in node firmware. Set the band with
; -D CAUCE_GATEWAY_REGION=\"EU868\" outside Uruguay; it must match the nodes' lora_region.
[env:gateway]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; The core adds -std=gnu++11 after our flags, which built every library as C++11 while the
; firmware is written to C++17. Removing it leaves -std=gnu++17 as the only standard.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_src_filter = +<gateway_main.cpp>
; cauce_hal is compiled whole, and its HTTP transport needs ArduinoJson even though the bridge
; never calls it.
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
