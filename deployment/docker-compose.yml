services:
  cauce-central:
    build: ../backend
    # Bound to loopback only: the LAN reaches the central through Caddy, and
    # this mapping exists so an operator can debug on the host.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CAUCE_DB_PATH: /data/cauce.sqlite
      CAUCE_SYNC_TOKEN: ${CAUCE_SYNC_TOKEN:-}
      # Leave this empty and every write answers 503 admin_api_not_configured. That is
      # deliberate: with no token there is no credential to check, so allowing writes
      # would leave the port open to anyone who can reach it. Reads stay open so the
      # dashboard works on a trusted LAN. Generate one with:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      CAUCE_API_TOKEN: ${CAUCE_API_TOKEN:-}
      # The certificate authority seed. Empty and the three certificate endpoints answer
      # 503, which is deliberate for the same reason the admin token does: an unconfigured
      # CA that issued anyway would produce documents that look authoritative and verify
      # against no key. NOT the same seed as CAUCE_API_TOKEN - that is the point of having
      # two, since a certificate authority whose key is also the admin credential is one
      # compromise away from minting certificates for any node.
      #   python -c "import secrets; print(secrets.token_hex(32))"
      CAUCE_CA_KEY: ${CAUCE_CA_KEY:-}
      CAUCE_CERT_VALIDITY_SECONDS: ${CAUCE_CERT_VALIDITY_SECONDS:-7776000}
      CAUCE_RATE_LIMIT: ${CAUCE_RATE_LIMIT:-120}
      CAUCE_RETENTION_ENABLED: ${CAUCE_RETENTION_ENABLED:-1}
      CAUCE_RETENTION_DAYS: ${CAUCE_RETENTION_DAYS:-365}
    volumes:
      - cauce-data:/data
    restart: unless-stopped

  # TLS terminator. The central never leaves this network unencrypted.
  # Set CAUCE_DOMAIN to the hostname the nodes use. Leave CAUCE_TLS_MODE empty
  # and set ACME_EMAIL to get a real ACME certificate; set
  # CAUCE_TLS_MODE=internal only when there is no public DNS name and the nodes
  # will be given Caddy's local root certificate instead.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - cauce-central
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    environment:
      CAUCE_DOMAIN: ${CAUCE_DOMAIN:-cauce.local}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CAUCE_TLS_MODE: ${CAUCE_TLS_MODE:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  cauce-data:
  caddy-data:
  caddy-config:
