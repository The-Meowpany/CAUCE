# CAUCE node configuration — schema_version 1
# Lines: key=value. '#' starts a comment. Unknown keys are ignored
# (forward compatibility). Invalid values fall back to backup/defaults.

schema_version=1

# Identity — must be unique per physical node
node_id=CAUCE-001
site_id=plaza-central

# Location (optional; leave empty if not declared)
# latitude=-34.54  longitude=-56.29  elevation_m=42.0
latitude=
longitude=
elevation_m=
land_cover=urban
shade_condition=partial

# Operation
sampling_interval_s=60
sync_interval_s=900
tz_offset_min=-180

# Network (offline-first: node works with wifi_enabled=0)
wifi_enabled=0
wifi_ssid=
wifi_password=
ntp_server=pool.ntp.org

# Local storage budget
storage_max_bytes=524288
segment_max_bytes=65536

# Admin token stored ONLY as SHA-256 hex of the secret
admin_token_sha256=

# Validation thresholds (per variable)
thr_range_min_air_temperature=-40.00
thr_range_max_air_temperature=85.00
thr_rise_pm_air_temperature=5.00
thr_drop_pm_air_temperature=5.00
