# CAUCE node configuration — schema_version 1
# Lines: key=value. '#' starts a comment. Unknown keys are ignored
# (forward compatibility). Invalid values fall back to backup/defaults.

schema_version=1

# Identity — must be unique per physical node
node_id=CAUCE-001
site_id=plaza-central

# Location (optional; leave empty when not declared)
# latitude=-34.54  longitude=-56.29  elevation_m=42.0
latitude=
longitude=
elevation_m=
land_cover=urban
shade_condition=partial

# Operation
sampling_interval_s=60
sync_interval_s=900
tz_offset_min=-180

# Network (offline-first: node works with wifi_enabled=0)
wifi_enabled=0
wifi_ssid=
wifi_password=
ntp_server=pool.ntp.org
# Central sync endpoint (empty = no Wi-Fi sync; e.g. http://192.168.1.10:8000/v1/sync)
sync_server_url=
# OTA release manifest (empty = OTA dormant; e.g. http://192.168.1.10:8000/v1/ota/manifest)
ota_manifest_url=
# Public half of the offline release key (64 hex, from tools/sign_release.py keygen). When
# set, firmware must carry its Ed25519 signature and HMAC-only manifests are refused.
ota_public_key=
# Per-device HMAC secret issued at provisioning
sync_device_key=

# LoRa sync (optional; Wi-Fi batch remains the full-resolution path)
lora_enabled=0
lora_sync_interval_s=3600
# Uruguay uses the 915-928 MHz band (AU915). Set EU868/US915/AS923 elsewhere.
lora_region=AU915
# Frame signature; must match device_key_algorithm at the central:
# hmac (uses sync_device_key) or ed25519 (uses the seed in sync_auth_seed)
lora_frame_algorithm=hmac

# Peer exchange over ESP-NOW (off by default). Frames are Ed25519-signed with the seed in
# sync_auth_seed and merged only from the neighbours listed here; tools/provision.py prints
# this line for a batch. A node without a seed, or with a malformed list, does not start it.
peer_enabled=0
peer_channel=1
peer_keys=
peer_interval_s=60
# This node's CA-signed peer credential (240 hex), returned as peer_credential when the
# central issues its certificate. Neighbours that pin ca_public_key trust it without peer_keys.
peer_credential=

# Local storage budget
storage_max_bytes=524288
segment_max_bytes=65536

# Deep sleep is OFF by default. Enable only after the B-series power
# measurements confirm the energy balance (docs/en/BENCH_PLAN.md).
# Requires a node without a live Wi-Fi link: it never sleeps while
# connected, serving the portal, or updating firmware.
deep_sleep_enabled=0

# Sensors. All off by default: a probe is enabled only where it is fitted, and a node
# that lacks one keeps measuring everything else. Pin map: docs/en/HARDWARE.md.
rtc_enabled=0
# microSD archive (CSV per UTC day); measurement never depends on it
sd_archive_enabled=0
light_enabled=0
voc_enabled=0
pm_enabled=0
co2_enabled=0
uv_enabled=0
lightning_enabled=0
lightning_indoor=0
soil_temperature_enabled=0
wind_enabled=0
wind_diameter_m=0.1500
wind_pulses_per_rev=3
vane_enabled=0
vane_offset_deg=0.0000
rain_enabled=0
rain_mm_per_tip=0.2794
# Analogue probes: two-point calibrations in millivolts at the ADC pin
# (docs/en/CALIBRATION_PROCEDURE.md), or a linear scale.
soil_moisture_enabled=0
soil_moisture_dry_mv=2600.0000
soil_moisture_wet_mv=1100.0000
leaf_wetness_enabled=0
leaf_wetness_dry_mv=3000.0000
leaf_wetness_wet_mv=800.0000
irradiance_enabled=0
irradiance_wm2_per_mv=0.5000
soil_potential_enabled=0
soil_potential_kpa_per_mv=0.6000
soil_potential_offset_kpa=0.0000
# Alternating-polarity read through an MCP23008 at 0x20 (see HARDWARE.md); the fit above applies.
soil_potential_ac=0
battery_monitor_enabled=0
battery_divider_ratio=5.5450

# Admin token stored ONLY as its SHA-256 hex digest
admin_token_sha256=

# Validation thresholds (per variable). Only overrides need to be listed: anything
# absent keeps the firmware default, and the node writes back only what differs.
thr_range_min_air_temperature=-40.00
thr_range_max_air_temperature=85.00
thr_rise_pm_air_temperature=5.00
thr_drop_pm_air_temperature=5.00
