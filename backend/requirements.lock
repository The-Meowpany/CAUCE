# Fully pinned dependency closure for the CAUCE central, with SHA-256 hashes.
#
# WHAT THIS IS FOR
#
# requirements.txt states intent with ranges, which means two installs a month apart get
# different trees. That is fine for development and wrong for anything whose output has to
# be attributable: a signature check, a security review, a release. This file pins every
# package in the closure, so the tree behind a build can be named exactly.
#
# Install with:  pip install --require-hashes -r requirements.lock
#
# HOW IT WAS GENERATED, AND HOW TO REGENERATE IT
#
# One pip download per platform, into its own directory, then merge the hashes:
#
#   pip download --only-binary=:all: --python-version 3.12 -d dist/win_amd64
#     --platform win_amd64 -r requirements.txt
#   pip download --only-binary=:all: --python-version 3.12 -d dist/manylinux2014_x86_64
#     --platform manylinux2014_x86_64 -r requirements.txt
#   pip hash dist/*/*.whl
#
# (Kept as separate commands on purpose. No line in this header ends in a backslash,
# because pip joins a trailing backslash to the following line even inside a comment, and
# that silently swallows the first requirement in the file.)
#
# Passing several --platform values to a single pip download does NOT work either: pip
# resolves one candidate per requirement and keeps the first platform that matches, so the
# result covers only one platform. That is how the first version of this file ended up with
# Windows hashes and would have failed on the Linux CI runner.
#
# Do not hand-edit it. Regenerate it in the same commit as any requirements.txt change, so
# the two never disagree.
#
# WHAT IS AND IS NOT PINNED HERE
#
# Hashes cover CPython 3.12 on win_amd64 and manylinux2014_x86_64, which are the two
# platforms this project runs on: a developer on Windows and CI on Linux. A third platform
# cannot install with --require-hashes until its wheels are added, and that is the intended
# behaviour - an unhashed platform should fail loudly rather than install something
# unchecked. Adding one means adding its download above, not relaxing the hashes.
#
# cffi and pycparser are here because they are conditional dependencies of cryptography that
# pip resolves for platforms whose wheel is not self-contained. Deriving the closure by
# walking importlib.metadata misses them, which is why this file was generated with pip.
#
# The six direct dependencies, the ones requirements.txt names directly rather than as
# something's dependency, are: cryptography, fastapi, httpx, pydantic, pytest, uvicorn.
#
# Do not annotate those lines with a trailing comment. A comment on a requirement line
# swallows the backslash that continues it, so pip stops reading the hashes below and then
# refuses to install in --require-hashes mode with "hashes are missing" - pointing at a file
# that visibly has them.
#
# PlatformIO, ruff and the firmware toolchain are NOT here. They are development tools, not
# the service's runtime, and they are pinned where they are used instead: the CI workflow
# pins ruff and platformio to exact versions.

